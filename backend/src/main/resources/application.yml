server:
  port: 8080

spring:
  application:
    name: aigis-backend

  datasource:
    url: jdbc:h2:file:./data/aigisdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.aigis.backend: DEBUG

aigis:
  ai:
    python-engine:
      url: ${PYTHON_AI_ENGINE_URL:http://localhost:8000/api/v1/ai/generate}
    groq:
      api-key: ${GROQ_API_KEY:}
      url: https://api.groq.com/openai/v1/chat/completions
      model: llama-3.3-70b-versatile
    openai:
      api-key: ${OPENAI_API_KEY:}
      realtime-model: ${OPENAI_REALTIME_MODEL:gpt-4o-realtime-preview}
      voice: ${OPENAI_REALTIME_VOICE:alloy}
